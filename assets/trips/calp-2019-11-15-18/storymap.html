<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calp Coastal Storymap</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Roboto Flex", sans-serif;
        background: #f5f1e6;
        color: #111;
      }
      .story-shell {
        display: grid;
        grid-template-columns: minmax(320px, 400px) minmax(0, 1fr);
        height: 100vh;
      }
      .story-sidebar {
        padding: 1.8rem 1.4rem;
        background: rgba(255, 255, 255, 0.96);
        border-right: 1px solid rgba(0, 0, 0, 0.08);
        display: flex;
        flex-direction: column;
        gap: 1.4rem;
      }
      .story-sidebar h1 {
        font-family: "Roboto Mono", monospace;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 1.4rem;
        margin: 0;
      }
      .story-sidebar p {
        margin: 0;
        line-height: 1.4;
      }
      .story-mode-toggle {
        display: inline-flex;
        border-radius: 999px;
        border: 1px solid rgba(0, 0, 0, 0.2);
        overflow: hidden;
        width: fit-content;
      }
      .story-mode-toggle button {
        border: 0;
        padding: 0.4rem 0.9rem;
        background: transparent;
        font-family: "Roboto Mono", monospace;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        cursor: pointer;
        transition: background 0.2s ease, color 0.2s ease;
      }
      .story-mode-toggle button.active {
        background: #0000bf;
        color: #fff;
      }
      .overlay-toggle-group {
        display: grid;
        gap: 0.5rem;
      }
      .overlay-toggle-group button {
        border: 1px solid rgba(0, 0, 0, 0.2);
        background: #fff;
        padding: 0.5rem 0.75rem;
        border-radius: 10px;
        text-align: left;
        font-family: "Roboto Mono", monospace;
        letter-spacing: 0.05em;
        cursor: pointer;
        transition: transform 0.16s ease, box-shadow 0.16s ease;
      }
      .overlay-toggle-group button.active {
        background: rgba(0, 0, 191, 0.1);
        border-color: #0000bf;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.08);
      }
      .story-steps {
        display: grid;
        gap: 0.9rem;
        overflow-y: auto;
      }
      .story-step {
        border: 1px solid rgba(0, 0, 0, 0.1);
        border-radius: 12px;
        padding: 0.9rem 1rem;
        background: #fff;
        cursor: pointer;
        transition: transform 0.16s ease, box-shadow 0.16s ease;
      }
      .story-step.active {
        border-color: #0000bf;
        box-shadow: 0 14px 28px rgba(0, 0, 0, 0.08);
      }
      .story-step h2 {
        font-family: "Roboto Mono", monospace;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 0.9rem;
        margin: 0;
      }
      .story-step .story-step-time {
        font-family: "Roboto Mono", monospace;
        font-size: 0.8rem;
        color: #666;
      }
      .story-step p {
        margin: 0.4rem 0 0;
        line-height: 1.4;
      }
      .map-area {
        position: relative;
      }
      #map {
        width: 100%;
        height: 100%;
      }
      .legend {
        position: absolute;
        right: 18px;
        bottom: 18px;
        background: rgba(255, 255, 255, 0.92);
        border-radius: 12px;
        padding: 0.9rem 1.1rem;
        box-shadow: 0 18px 32px rgba(0, 0, 0, 0.12);
        font-family: "Roboto Mono", monospace;
        font-size: 0.8rem;
        letter-spacing: 0.05em;
        display: none;
        min-width: 180px;
      }
      .legend h3 {
        margin: 0 0 0.6rem;
        font-size: 0.85rem;
        text-transform: uppercase;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin: 0.3rem 0;
      }
      .legend-swatch {
        width: 16px;
        height: 16px;
        border-radius: 4px;
      }
      .story-step-meta {
        display: flex;
        gap: 0.6rem;
        margin-top: 0.5rem;
        font-family: "Roboto Mono", monospace;
        font-size: 0.75rem;
        letter-spacing: 0.04em;
      }
      .notes-panel {
        font-size: 0.9rem;
        color: #333;
      }
      .story-popup {
        font-size: 0.85rem;
        max-width: 240px;
      }
      .story-popup strong {
        display: block;
        font-family: "Roboto Mono", monospace;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 0.2rem;
      }
      .story-popup ul {
        margin: 0.4rem 0 0;
        padding-left: 1.1rem;
      }
      @media (max-width: 960px) {
        .story-shell {
          grid-template-columns: 100%;
          grid-template-rows: 320px 1fr;
        }
        .story-sidebar {
          border-right: none;
          border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        }
      }
    </style>
  </head>
  <body>
    <div class="story-shell" data-mode="research">
      <aside class="story-sidebar">
        <div>
          <h1>Calp Coastal Suitability</h1>
          <p>
            Scroll through dawn transects, underwater habitat checks, and evening
            acoustic comfort. Layers borrow the Oysterbnb MaxEnt workflow to
            visualise where tourism and ecology stay in balance.
          </p>
        </div>
        <div class="story-mode-toggle" role="group" aria-label="Copy mode">
          <button type="button" data-mode="research" class="active">
            Research
          </button>
          <button type="button" data-mode="composition">Composition</button>
        </div>
        <div class="overlay-toggle-group" aria-label="Map overlays">
          <button type="button" data-overlay="suitability" class="active">
            Suitability hex
          </button>
          <button type="button" data-overlay="field" class="active">
            Field measurements
          </button>
          <button type="button" data-overlay="acoustics" class="active">
            Acoustic line
          </button>
        </div>
        <div class="story-steps" id="storySteps" aria-live="polite"></div>
        <div class="notes-panel" id="overlayNotes"></div>
      </aside>
      <div class="map-area">
        <div id="map" role="presentation"></div>
        <div class="legend" id="mapLegend">
          <h3 id="legendTitle"></h3>
          <div id="legendItems"></div>
        </div>
      </div>
    </div>

    <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
    <script src="/assets/trips/calp-2019-11-15-18/storymap.js"></script>
  </body>
</html>
