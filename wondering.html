      "html": "<p>Zine-making slips into the everyday:\npages filled with fragments, collages,<br />\nscraps of mood and memory.<br />\nIt felt like a pocket-sized stage<br />\nfor sketches, notes, and fragments of thought.</p>\n\n<p>Sometimes it turns toward fandom,<br />\na way of keeping songs, lyrics, and characters close.<br />\nEach zine feels like a diary in disguise,<br />\nprivate and playful at once.</p>"

      "url": "/wondering/watercolor/",
      "html": "<p>Watercolour is a practice in both control and uncontrol.<br />\nThe brush teaches how water carries colour,<br />\nsometimes precise, sometimes drifting freely.</p>\n\n<p>I found that letting it wander was also part of the joy,<br />\nas if the page itself joined the act of painting.</p>"

      "html": "<p>Trip planning has its own pleasure,<br />\ndifferent from the journey itself.<br />\nI enjoy crafting itineraries that hold both detail and openness,\nbalancing exploration with rest,<br />\nand weaving in moments to meet a place slowly.</p>\n\n<p>Sometimes I plan for myself,<br />\nsometimes for others,<br />\nalways as a way of imagining<br />\nthe adventure before it begins.</p>"

      "html": "<p>Travel has been with me since childhood,<br />\nfirst on family trips across the country,<br />\nlater on journeys abroad during college.</p>\n\n<p>I think I simply enjoy being elsewhere,\nseeing how streets, voices, and skies<br />\nshift from place to place,<br />\neach moment carrying its own rhythm of arrival.</p>"
