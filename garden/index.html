    <main>
      <section class="frame garden-page" aria-label="Fun with Flowers">
  <!-- Paper background -->
  <div class="paper-bg"></div>

  <!-- Shelf scene -->
  <div class="shelf-scene" id="shelfScene">
    <img class="shelf-stroke" src="https://assets.yipengshen.com/garden/art/shelf/shelf_a.webp" alt="" />
    <div class="pots-wrap" id="potsWrap" aria-live="polite"></div>
    <div class="idle-hint" id="idleHint" aria-hidden="true">Start your garden — choose a plant.</div>
  </div>

  <!-- Plant focus overlay -->
  <div class="plant-focus" id="plantFocus" aria-hidden="true">
    <button class="back" id="backBtn" aria-label="Back">←</button>
    <div class="plant-hero">
      <img id="plantArt" alt="" />
      <div class="stickers">
        <button class="sticker" data-tab="sowing" id="tabSowing">Sowing</button>
        <button class="sticker" data-tab="care" id="tabCare">Care</button>
        <button class="sticker" data-tab="pests" id="tabPests">Pests</button>
      </div>
      <div class="sticker-content" id="stickerContent"></div>
      <button class="plant-btn" id="plantBtn">Plant in My Garden</button>
    </div>
  </div>

  <!-- My Garden scene -->
  <div class="my-garden" id="myGarden" aria-hidden="true">
    <img class="shelf-stroke" src="https://assets.yipengshen.com/garden/art/shelf/shelf_b.webp" alt="" />
    <div class="my-pots" id="myPots"></div>
  </div>

  <!-- Comfort toggles -->
  <div class="comfort">
    <button id="audioToggle">Sound: on</button>
    <button id="motionToggle">Motion: on</button>
  </div>
</section>

<script>
(async function(){
  // 1) Fetch manifest
  const res = await fetch('/assets/garden/plants.json');
  const PLANTS = await res.json();

  // 2) Minimal shelf render (thumbs only)
  const wrap = document.getElementById('potsWrap');
  PLANTS.forEach(p => {
    const el = document.createElement('button');
    el.className = 'pot-card';
    el.setAttribute('data-id', p.id);
    el.innerHTML = `
      <img class="pot-img" src="${p.art.pot}" alt="" />
      <img class="plant-thumb" src="${p.art.thumb}" alt="${p.name_en}" />
      <div class="label">${p.name_zh} · ${p.name_en}</div>
    `;
    el.addEventListener('click', () => openPlant(p));
    wrap.appendChild(el);
  });

  // 3) Simple scene state (no audio yet)
  const plantFocus = document.getElementById('plantFocus');
  const plantArt = document.getElementById('plantArt');
  const stickerContent = document.getElementById('stickerContent');
  const backBtn = document.getElementById('backBtn');
  const plantBtn = document.getElementById('plantBtn');
  const myGarden = document.getElementById('myGarden');
  const myPots = document.getElementById('myPots');

  let current = null;
  let garden = JSON.parse(localStorage.getItem('garden_v1') || '[]');

  function openPlant(p){
    current = p;
    plantArt.src = p.art.plant; plantArt.alt = p.name_en;
    showSticker('sowing', p);
    plantFocus.setAttribute('aria-hidden','false');
    document.getElementById('shelfScene').setAttribute('aria-hidden','true');
  }

  function showSticker(tab, p){
    const map = { sowing: p.copy.sowing, care: p.copy.care, pests: p.copy.pests };
    stickerContent.textContent = map[tab] || '';
  }

  document.getElementById('tabSowing').onclick = ()=> showSticker('sowing', current);
  document.getElementById('tabCare').onclick   = ()=> showSticker('care', current);
  document.getElementById('tabPests').onclick  = ()=> showSticker('pests', current);

  backBtn.onclick = ()=>{
    plantFocus.setAttribute('aria-hidden','true');
    document.getElementById('shelfScene').setAttribute('aria-hidden','false');
  };

  plantBtn.onclick = ()=>{
    if(!current) return;
    if(!garden.includes(current.id)) garden.push(current.id);
    localStorage.setItem('garden_v1', JSON.stringify(garden));
    renderMyGarden();
    plantFocus.setAttribute('aria-hidden','true');
    myGarden.setAttribute('aria-hidden','false');
  };

  function renderMyGarden(){
    myPots.innerHTML = '';
    garden.forEach(id=>{
      const p = PLANTS.find(x=>x.id===id);
      if(!p) return;
      const el = document.createElement('div');
      el.className = 'my-pot';
      el.innerHTML = `
        <button class="mute" aria-label="Mute/Unmute" data-id="${id}">♫</button>
        <img class="pot-img" src="${p.art.pot}" alt="" />
        <img class="plant-thumb" src="${p.art.thumb}" alt="${p.name_en}" />
        <div class="label">${p.name_zh} · ${p.name_en}</div>
      `;
      myPots.appendChild(el);
    });
  }

  // initial render of My Garden if any
  if(garden.length){ renderMyGarden(); }

})();
</script>
