    <main>
      <section class="garden" aria-label="Fun with Flowers">
  <!-- Layered canvas experience -->
  <div id="fxStage" class="fx-stage" aria-hidden="true"></div>

  <!-- Intro brush + swell -->
  <div id="gardenIntro" class="intro" aria-hidden="true">
    <div class="intro__brush" id="introBrush"></div>
    <p class="intro__whisper" id="introWhisper">Sound and growth share time as their material.</p>
  </div>

  <!-- Preloader when assets stream -->
  <div id="preloader" class="preloader" aria-live="polite">
    <div class="wash"><div class="fill" id="washFill"></div></div>
    <div class="hint" id="preHint">Preparing the garden...</div>
  </div>

  <!-- Paper fallback -->
  <div class="paper" id="paper"></div>

  <!-- Shelf (Home scene) -->
  <div class="scene scene-shelf" id="sceneShelf" aria-hidden="true">
    <div class="shelf-wrap">
      <img class="shelf" id="shelfA" alt="" />
      <div class="pots" id="pots" role="list"></div>
    </div>
    <div class="hint idle" id="shelfHint" aria-live="polite">Start your garden when a pot calls to you.</div>
  </div>

  <!-- Plant focus vignette -->
  <div class="scene scene-focus" id="sceneFocus" aria-hidden="true">
    <button class="back" id="backBtn" type="button" aria-label="Back to shelf">Back</button>
    <div class="focus-frame">
      <div class="focus-artwrap">
        <img id="focusArt" class="focus-art" alt="" />
        <div class="focus-reveal" id="focusReveal" aria-hidden="true"></div>
      </div>
      <div class="stickers" id="stickerRail" role="tablist" aria-label="Care notes">
        <button class="sticker" id="tabSowing" data-tab="sowing" role="tab" aria-selected="true">Sowing</button>
        <button class="sticker" id="tabCare" data-tab="care" role="tab" aria-selected="false">Care</button>
        <button class="sticker" id="tabPests" data-tab="pests" role="tab" aria-selected="false">Pests</button>
      </div>
      <article class="sticker-body" id="stickerBody" role="tabpanel" aria-live="polite"></article>
      <button class="plant-btn" id="plantBtn" type="button">
        <span class="plant-btn__seed" aria-hidden="true"></span>
        <span class="plant-btn__label">Plant in My Garden</span>
      </button>
    </div>
  </div>

  <!-- My Garden composition shelf -->
  <div class="scene scene-mygarden" id="sceneMy" aria-hidden="true">
    <div class="my-wrap">
      <img class="shelf" id="shelfB" alt="" />
      <div class="my-pots" id="myPots"></div>
    </div>
    <div class="watering-can" id="wateringCan" aria-hidden="true"></div>
  </div>

  <div class="exit" id="exitPrompt" aria-hidden="true">Leave it growing; come back anytime.</div>

  <div class="comfort">
    <button id="audioToggle" aria-pressed="true">Sound: on</button>
    <button id="motionToggle" aria-pressed="true">Motion: on</button>
  </div>

  <noscript><p style="padding:1rem">This garden needs JavaScript enabled.</p></noscript>
</section>
