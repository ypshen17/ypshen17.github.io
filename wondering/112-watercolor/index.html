<p>Watercolour is a practice in both control and uncontrol.<br />
The brush teaches how water carries colour,<br />
sometimes precise, sometimes drifting freely.</p>

<p>I found that letting it wander was also part of the joy,<br />
as if the page itself joined the act of painting.</p>
